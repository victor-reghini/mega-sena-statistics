name: Sincronizar Loterias Caixa

on:
  schedule:
    # Executa todos os dias em 3 horários (horário de Brasília = UTC - 3):
    # 23:15 UTC = 20:15 BRT (logo após o término do sorteio das 20h)
    # 01:15 UTC = 22:15 BRT (apuração oficial e rateio consolidados)
    # 03:15 UTC = 00:15 BRT (checagem noturna para apurações atrasadas)
    - cron: '15 23,1,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executar script de sincronização de todas as loterias
        run: python3 scripts/sync-draws.py

      - name: Comitar e enviar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nenhuma atualização encontrada. Repositório mantido inalterado."
          else
            UPDATED=$(git diff --staged --name-only data/*.json | sed -E 's|data/(.*)\.json|\1|' | paste -sd, -)
            if [ -n "$UPDATED" ]; then
              git commit -m "chore(data): atualizar resultados ($UPDATED) [skip ci]"
            else
              git commit -m "chore(data): atualizar resultados das loterias Caixa [skip ci]"
            fi
            git push
          fi
