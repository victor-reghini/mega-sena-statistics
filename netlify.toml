[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,STRIPE_PAYMENT_LINK,STRIPE_PRICE_ID,STRIPE_PUBLIC_KEY,SMTP_USER,SMTP_HOST,SMTP_PORT,STRIPE_PRICE_ID_EXPORT_MEGASENA,STRIPE_PRICE_ID_EXPORT_LOTOFACIL,STRIPE_PRICE_ID_EXPORT_QUINA,STRIPE_PRICE_ID_EXPORT_LOTOMANIA,STRIPE_PRICE_ID_EXPORT_MAISMILIONARIA,STRIPE_PRICE_ID_EXPORT_TIMEMANIA,STRIPE_PRICE_ID_EXPORT_DUPLASENA,STRIPE_PRICE_ID_EXPORT_DIADESORTE,STRIPE_PRICE_ID_EXPORT_SUPERSETE,STRIPE_PRICE_ID_COMBO_ALL,STRIPE_PRICE_ID_KIT_BOLAO_VIRADA,STRIPE_PRICE_ID_DOSSIE_ESPECIAIS,STRIPE_PRICE_ID_SUPER_COMBO,STRIPE_LINK_EXPORT_MEGASENA,STRIPE_LINK_EXPORT_LOTOFACIL,STRIPE_LINK_EXPORT_QUINA,STRIPE_LINK_EXPORT_LOTOMANIA,STRIPE_LINK_EXPORT_MAISMILIONARIA,STRIPE_LINK_EXPORT_TIMEMANIA,STRIPE_LINK_EXPORT_DUPLASENA,STRIPE_LINK_EXPORT_DIADESORTE,STRIPE_LINK_EXPORT_SUPERSETE,STRIPE_LINK_COMBO_ALL,STRIPE_LINK_KIT_BOLAO_VIRADA,STRIPE_LINK_DOSSIE_ESPECIAIS,STRIPE_LINK_SUPER_COMBO"

# Proteção: Bloqueio de acesso direto a arquivos de configuração sensíveis e de servidor
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

# Landing page dedicada da Mega da Virada
[[redirects]]
  from = "/mega-da-virada"
  to = "/mega-da-virada.html"
  status = 200

[[redirects]]
  from = "/mega-da-virada/"
  to = "/mega-da-virada.html"
  status = 200

# Redirecionamento das rotas da API para Netlify Functions
[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/verify-session"
  to = "/.netlify/functions/verify-session"
  status = 200

[[redirects]]
  from = "/api/authorize-export"
  to = "/.netlify/functions/authorize-export"
  status = 200

[[redirects]]
  from = "/api/send-export-email"
  to = "/.netlify/functions/send-export-email"
  status = 200

[[redirects]]
  from = "/api/email-verification"
  to = "/.netlify/functions/email-verification"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://adservice.google.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://loteriascaixa-api.herokuapp.com https://api.stripe.com https://pagead2.googlesyndication.com https://*.google.com https://*.doubleclick.net; frame-src 'self' https://js.stripe.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; object-src 'none'; base-uri 'self';"
